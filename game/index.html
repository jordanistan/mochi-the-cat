<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111018" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <div class="tv">
      <canvas id="screen" width="256" height="240" aria-label="Whack-a-Mouse game screen"></canvas>

      <span class="help"><span class="desktop-only">CLICK to whack &middot; M to mute &middot; F full screen</span><span class="touch-only">TAP to whack</span></span>
